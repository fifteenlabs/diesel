[package]
name = "diesel_derives"
version = "2.3.10"
license = "MIT OR Apache-2.0"
description = "You should not use this crate directly, it is internal to Diesel."
documentation = "https://diesel.rs/guides/"
homepage = "https://diesel.rs"
repository = "https://github.com/diesel-rs/diesel/"
autotests = false
rust-version.workspace = true
edition.workspace = true
include = ["src/**/*.rs", "src/tests/snapshots/*", "LICENSE-*", "README.md", "build.rs"]

[dependencies]
syn = { version = "3.0", features = ["derive", "fold", "full", "visit-mut"] }
quote = "1.0.9"
proc-macro2 = "1.0.27"
diesel_table_macro_syntax = { version = "0.3", path = "../diesel_table_macro_syntax" }
diesel_attribute_parser = { version = "0.1", path = "../diesel_attribute_parser" }
dsl_auto_type = { version = "0.2", path = "../dsl_auto_type" }
# `#[derive(UnionSchema)]` derives DDL names from Rust idents.
heck = { version = "0.5", optional = true }
# ... and then has to spell each of those names the way Turso will store it,
# which for a keyword means quoted. `turso_parser::lexer::is_quotable_keyword`
# is the engine's own answer to that question, asked at expansion time so the
# emitted `TAG_NAME` is a plain string literal with no runtime cost.
turso_parser = { workspace = true, optional = true }

[dev-dependencies]
cfg-if = "1"
dotenvy = "0.15"
insta = "1.21"
prettyplease = "0.3"

[dev-dependencies.diesel]
path = "../diesel"

[lib]
proc-macro = true

[[test]]
name = "tests"

[features]
default = []
nightly = ["proc-macro2/nightly", "diesel_attribute_parser/nightly"]
postgres = []
sqlite = []
mysql = []
mariadb = []
32-column-tables = []
64-column-tables = ["32-column-tables"]
128-column-tables = ["64-column-tables"]
without-deprecated = ["diesel_attribute_parser/without-deprecated"]
with-deprecated = ["diesel_attribute_parser/with-deprecated"]
r2d2 = []
chrono = []
time = []
numeric = []
turso = ["dep:heck", "dep:turso_parser"]

[package.metadata.docs.rs]
features = ["postgres", "mysql", "mariadb", "sqlite", "chrono", "numeric", "time", "r2d2"]
no-default-features = true
rustc-args = ["--cfg", "diesel_docs"]
rustdoc-args = ["--cfg", "diesel_docs", "-Z", "unstable-options", "--generate-link-to-definition", "--generate-macro-expansion"]

[lints]
workspace = true
