[package]
name = "diesel"
version = "2.3.1"
license = "MIT OR Apache-2.0"
description = "A safe, extensible ORM and Query Builder for PostgreSQL, SQLite, and MySQL"
readme = "README.md"
documentation = "https://docs.rs/diesel/"
homepage = "https://diesel.rs"
repository = "https://github.com/diesel-rs/diesel"
keywords = ["orm", "database", "sql"]
categories = ["database"]
edition.workspace = true
rust-version.workspace = true
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "LICENSE-*",
    "README.md",
    "src/sqlite/connection/diesel_manage_updated_at.sql",
    "src/migration/setup_migration_table.sql",
]

[dependencies]
byteorder = { version = "1.0", optional = true }
chrono = { version = "0.4.20", optional = true, default-features = false, features = ["clock", "std"] }
libc = { version = "0.2.0", optional = true }
mysqlclient-sys = { version = ">=0.2.5, <0.5.0",  optional = true }
mysqlclient-src = { version = "0.1.0", optional = true }
pq-sys = { version = ">=0.4.0, <0.8.0", optional = true }
pq-src = { version = "0.3", optional = true }
quickcheck = { version = "1.0.3", optional = true }
serde_json = { version = ">=0.8.0, <2.0", optional = true }
url = { version = "2.1.0", optional = true }
percent-encoding = { version = "2.1.0", optional = true }
uuid = { version = ">=0.7.0, <2.0.0", optional = true }
gpui = { version = "0.2", optional = true }
ipnetwork = { version = ">=0.12.2, <0.22.0", optional = true }
ipnet = { version = "2.5.0", optional = true }
num-bigint = { version = ">=0.2.0, <0.5.0", optional = true }
num-traits = { version = "0.2.0", optional = true }
num-integer = { version = "0.1.39", optional = true }
bigdecimal = { version = ">=0.0.13, < 0.5.0", optional = true }
bitflags = { version = "2.0.0", optional = true }
r2d2 = { version = ">= 0.8.2, < 0.9.0", optional = true }
itoa = { version = "1.0.0", optional = true }
time = { version = "0.3.9", optional = true, features = ["macros"] }
downcast-rs = "2.0.1"
# The Turso backend's raw value *is* a `turso::Value` and its connection is
# the driver's own, so the backend names the driver throughout. Optional,
# and off by default.
turso = { workspace = true, optional = true }
# The UNION wire codec, the schema derive and the connection all report
# structured failures; `thiserror` is how they spell the `Display`/`Error`
# pair.
thiserror = { version = "2", optional = true }
# The statement cache's `establish`/`admit` decisions are traced, and the
# cap warning is the only signal that a query is minting SQL texts.
tracing = { version = "0.1", optional = true }
# Keys the statement cache. Not a general-purpose hasher choice: the cache
# is consulted on every statement execution and a collision there is
# harmless by construction (Turso keys its own cache by the SQL text, so a
# wrong answer changes whether a statement is cached, never which program
# runs), which is exactly the trade FxHash is for. See
# `turso::connection::hash_of` for the measurement, and for the one place
# in that file this hasher is deliberately *not* used.
rustc-hash = { version = "2", optional = true }

# --- the async half, formerly the `diesel-async` crate --------------------
# Unconditional there, optional here: a sync-only build of diesel must not
# compile the futures stack. Every async backend feature turns on `async`,
# which turns these on.
futures-core = { version = "0.3.17", optional = true }
futures-util = { version = "0.3.17", default-features = false, features = [
  "alloc",
  "sink",
], optional = true }
futures-channel = { version = "0.3.17", default-features = false, features = [
  "std",
  "sink",
], optional = true }
scoped-futures = { version = "0.1", features = ["std"], optional = true }
pin-project-lite = { version = "0.2.17", optional = true }
tokio = { version = "1.26", optional = true }
tokio-postgres = { version = "0.7.10", optional = true }
mysql_async = { version = "0.36.0", optional = true, default-features = false, features = [
  "minimal-rust",
] }
mysql_common = { version = "0.35.3", optional = true, default-features = false }
bb8 = { version = "0.9", optional = true }
async-trait = { version = "0.1.66", optional = true }
deadpool = { version = "0.13", optional = true, default-features = false, features = [
  "managed",
] }
mobc = { version = ">=0.7,<0.10", optional = true }

[dependencies.diesel_derives]
version = "~2.3.0"
path = "../diesel_derives"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
libsqlite3-sys = { version = ">=0.17.2, <0.36.0", optional = true, features = ["bundled_bindings"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = { version = ">=0.4.0, <0.6.0", optional = true, default-features = false }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
# Something is dependent on it, we use feature to override it.
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen-test = "0.3.49"

[dev-dependencies]
cfg-if = "1"
dotenvy = "0.15"
ipnetwork = ">=0.12.2, <0.22.0"
quickcheck = "1.0.3"
tempfile = "3.10.1"
diesel_test_helper = { path = "../diesel_test_helper" }
tokio = { version = "1.12.0", features = ["rt", "macros", "rt-multi-thread", "time", "sync"] }
assert_matches = "1.0.1"
futures-util = { version = "0.3.17", features = ["async-await-macro"] }
anyhow = "1"
scoped-futures = "0.1"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
chrono = "0.4"
# A dev-dependency on a crate that depends on this one. Cargo allows the
# cycle for dev-dependencies specifically, and it is what lets the Turso
# migration test live beside the rest of the Turso suite rather than in a
# crate of its own.
diesel_migrations = { path = "../diesel_migrations", features = ["async"] }

# The Turso backend's acceptance suite. `chrono` is here rather than in
# `required-features`' spirit of "the feature under test" because two of the
# modules cover Turso's handling of `chrono` types; `turso` alone builds and
# runs everything else.
[[test]]
name = "turso"
path = "tests/turso/main.rs"
harness = true
required-features = ["turso", "chrono"]

# `gpui::SharedString` as a UNION field type, in a target of its own rather
# than as one more module of the suite above. `gpui` does not currently
# resolve in this workspace — published `gpui 0.2.2` pulls `zed-font-kit`,
# which mixes two incompatible `core-graphics` versions — and while it was
# named in the suite's `required-features` it took the other 177 tests down
# with it: `cargo test --test turso` simply refused to select the target.
# One module needs gpui, so one target needs gpui.
[[test]]
name = "turso_shared_string"
path = "tests/turso_shared_string.rs"
harness = true
required-features = ["turso", "gpui"]

# `TursoConnection` behind bb8 and deadpool, in a target of its own for the
# same reason as the one above: naming `bb8` and `deadpool` in the suite's
# `required-features` makes the whole suite unselectable without them, and
# only one module needs them. It needs to exist at all because the bounds on
# a connection manager are checked where the manager is instantiated —
# nothing else in this repository names `TursoConnection` as a pooled type,
# so without this target `impl PoolableConnection for TursoConnection` reads
# as dead code. It was deleted on those grounds once already.
[[test]]
name = "turso_pooling"
path = "tests/turso_pooling.rs"
harness = true
required-features = ["turso", "bb8", "deadpool"]

[features]
default = ["with-deprecated", "32-column-tables"]
extras = ["chrono", "time", "serde_json", "uuid", "network-address", "numeric", "r2d2"]
unstable = ["diesel_derives/nightly"]
large-tables = ["32-column-tables"]
huge-tables = ["64-column-tables"]
32-column-tables = ["diesel_derives/32-column-tables"]
64-column-tables = ["32-column-tables", "diesel_derives/64-column-tables"]
128-column-tables = ["64-column-tables", "diesel_derives/128-column-tables"]
postgres = ["dep:pq-sys", "postgres_backend"]
sqlite = ["dep:libsqlite3-sys", "dep:sqlite-wasm-rs", "diesel_derives/sqlite", "time?/formatting", "time?/parsing"]
mysql = ["dep:mysqlclient-sys", "dep:url", "dep:percent-encoding", "dep:bitflags", "mysql_backend"]
without-deprecated = ["diesel_derives/without-deprecated"]
with-deprecated = ["diesel_derives/with-deprecated"]
network-address = ["dep:ipnetwork", "dep:libc"]
ipnet-address = ["dep:ipnet", "dep:libc"]
numeric = ["dep:num-bigint", "dep:bigdecimal", "dep:num-traits", "dep:num-integer", "diesel_derives/numeric"]
postgres_backend = ["diesel_derives/postgres", "dep:bitflags", "dep:byteorder", "dep:itoa"]
mysql_backend = ["diesel_derives/mysql", "dep:byteorder"]
returning_clauses_for_sqlite_3_35 = ["sqlite"]
# The Turso backend — the whole of it, from the SQL dialect to the
# connection. One switch, which is the requirement this feature exists to
# meet: while the backend was split over `diesel` and `diesel-async` a
# consumer named `turso` twice and could compile half of it, and there were
# `turso-chrono` and `turso-gpui` besides. `chrono` and `gpui` are ordinary
# diesel type-integration features now, so `turso` + `chrono` gives what
# `turso-chrono` did and nobody has to know the compound name exists.
#
# `serde_json` is how a string-list struct field is stored; `uuid` is the
# `sql_types::Uuid` alias and its codec. It does *not* drag in
# `postgres_backend`: `Timestamptz` is a Turso-local SQL type here, the way
# `TimestamptzSqlite` is SQLite's.
turso = [
    "async",
    "dep:turso",
    "dep:thiserror",
    "dep:tracing",
    "dep:rustc-hash",
    "serde_json",
    "uuid",
    "diesel_derives/turso",
]

# --- the async half ------------------------------------------------------
# `async` carries the futures stack and the connection traits and nothing
# backend-specific. It is not meant to be named directly; every async
# backend feature below turns it on.
async = [
    "i-implement-a-third-party-backend-and-opt-into-breaking-changes",
    "dep:futures-core",
    "dep:futures-util",
    "dep:scoped-futures",
    "dep:pin-project-lite",
]
# The async connections that came with `diesel-async`. They cannot be
# called `postgres`/`mysql`/`sqlite`: those names are taken by the sync
# backends in this crate and mean something else.
async-postgres = ["async", "postgres_backend", "dep:tokio-postgres", "tokio", "tokio/rt"]
async-mysql = [
    "async",
    "mysql_backend",
    "dep:mysql_async",
    "dep:mysql_common",
    "dep:futures-channel",
    "tokio",
]
async-sqlite = ["sqlite", "sync-connection-wrapper"]
sync-connection-wrapper = ["async", "tokio", "tokio/rt-multi-thread"]
async-connection-wrapper = ["async", "tokio", "tokio/net", "tokio/rt"]
# `async-pool` rather than `pool`, and separate from this crate's `r2d2`,
# because `r2d2` here is the *sync* pool and must not drag the futures
# stack in behind it.
async-pool = ["async"]
# An explicit feature rather than the `dep:tokio` shorthand, because
# `sync_connection_wrapper` reads `cfg(feature = "tokio")` to decide whether
# `SyncConnectionWrapper` gets a defaulted runtime parameter. As an optional
# dependency in the crate this came from, `tokio` implied a feature of the
# same name; `dep:tokio` suppresses that, and the cfg silently went false —
# which showed up as `SyncConnectionWrapper<SqliteConnection>` suddenly
# needing two type arguments.
tokio = ["dep:tokio"]
bb8 = ["async-pool", "dep:bb8"]
mobc = ["async-pool", "dep:mobc", "dep:async-trait", "tokio/sync"]
deadpool = ["async-pool", "dep:deadpool"]
i-implement-a-third-party-backend-and-opt-into-breaking-changes = []
r2d2 = ["diesel_derives/r2d2", "dep:r2d2"]
chrono = ["diesel_derives/chrono", "dep:chrono"]
time = ["diesel_derives/time", "dep:time"]
uuid = ["dep:uuid"]
serde_json = ["dep:serde_json"]
gpui = ["dep:gpui"]
__with_asan_tests = [
    "libsqlite3-sys?/bundled",
    "libsqlite3-sys?/with-asan",
    "pq-sys?/bundled",
    "pq-src?/with-asan",
    "mysqlclient-sys?/bundled",
    "mysqlclient-src?/with-asan",
]

[package.metadata.docs.rs]
features = ["postgres", "mysql", "sqlite", "extras"]
no-default-features = true
rustc-args = ["--cfg", "diesel_docs"]
rustdoc-args = ["--cfg", "diesel_docsrs", "-Z", "unstable-options", "--generate-link-to-definition", "--generate-macro-expansion"]

[lints]
workspace = true
