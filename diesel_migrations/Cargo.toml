[package]
name = "diesel_migrations"
version = "2.3.0"
license = "MIT OR Apache-2.0"
description = "Migration management for diesel"
documentation = "https://docs.rs/crate/diesel_migrations"
homepage = "https://diesel.rs"
repository = "https://github.com/diesel-rs/diesel"
edition = "2021"
include.workspace = true
rust-version.workspace = true
categories = ["database"]

[dependencies.migrations_internals]
version = "~2.3.0"
path = "migrations_internals"

[dependencies.migrations_macros]
version = "~2.3.0"
path = "migrations_macros"

[dev-dependencies]
dotenvy = "0.15"
cfg-if = "1.0.0"
tempfile = "3.2"

# `AsyncMigrationHarness` runs the sync migration machinery inside
# `block_in_place`, so it needs the runtime that provides it.
[dependencies.tokio]
version = "1.26"
optional = true

[dependencies.diesel]
version = "~2.3.0"
path = "../diesel"
default-features = false

[features]
default = []
# `AsyncMigrationHarness`, which runs migrations over an async connection by
# way of `diesel::async_connection_wrapper`. It lives here rather than in
# `diesel` because it implements *this* crate's `MigrationHarness`, and
# `diesel` cannot depend on `diesel_migrations` — the folded-in async code
# was the only thing that ever wanted to, which is why it is the one piece
# that did not move into `diesel`.
async = ["diesel/async-connection-wrapper", "dep:tokio", "tokio/rt-multi-thread"]
sqlite = []
postgres = []
mysql = []
